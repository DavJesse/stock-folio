# Authentication token for SonarQube (should be set as an environment variable)
sonar.token=${SONAR_TOKEN}

# Unique project key in SonarQube
sonar.projectKey=stock-portfolio

# Display name of the project in SonarQube
sonar.projectName=Stock Portfolio

# Project version
sonar.projectVersion=1.0

# Comma-separated paths to source directories
sonar.sources=src

# Comma-separated paths to test directories
sonar.tests=__tests__,tests

# File patterns to exclude from analysis (e.g., test files)
sonar.exclusions=**/*.test.ts,**/*.spec.ts

# File patterns to include as test files
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Path to the LCOV coverage report
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Source file encoding
sonar.sourceEncoding=UTF-8
