# OpenAPI specification for the Stock Portfolio Tracker API
openapi: 3.0.3

# General API metadata used by tools like Swagger UI
info:
  title: Stock Portfolio Tracker API           # Human-readable name of the API
  version: 1.0.0                                # Semantic version of the API definition
  description: >                                # Brief explanation of the API's purpose
    REST API for a simulated stock portfolio tracker, including 
    user authentication and portfolio management.

# Define the base URL for the API endpoints
servers:
  - url: https://localhost:3000/api             # Local development server base path
    description: Development server             # Label for server usage context

# Endpoint definitions grouped under `paths`
paths:
  /auth/signup:
    post:
      summary: Register a new user account      # Short description for API docs and UIs
      tags: [Authentication]                    # Logical grouping for endpoints
      requestBody:
        required: true                          # Indicates this endpoint requires a body
        content:
          application/json:
            schema:
              type: object
              required: [email, password]       # Mandatory fields in the request payload
              properties:
                email:
                  type: string                  # User's email address
                password:
                  type: string                  # User's plaintext password (to be hashed server-side)

      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string                # Success message (e.g., "User created")

        '400':
          description: Invalid input            # Triggered by missing or malformed fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string                # Error description (e.g., validation error)

        '409':
          description: User already exists      # Triggered if email is already registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string                # Error message (e.g., "User already exists.")

        '500':
          description: Internal server error    # Catch-all for unhandled exceptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string                # Generic error message (e.g., "Internal server error")

  /auth/signin:
      post:
        summary: Authenticate a user              # Short description for API docs and UIs
        tags: [Authentication]                    # Logical grouping for endpoints
        requestBody:
          required: true                          # Indicates this endpoint requires a body
          content:
            application/json:
              schema:
                type: object
                required: [email, password]       # Mandatory login credentials
                properties:
                  email:
                    type: string                  # User's registered email address
                  password:
                    type: string                  # User's plaintext password (validated against hashed version)

        responses:
          '200':
            description: Login successful
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    message:
                      type: string                # Success message (e.g., "Login successful")
                    token:
                      type: string                # Authentication token (e.g., JWT or session token)

          '400':
            description: Invalid input            # Triggered by missing or malformed credentials
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    error:
                      type: string                # Error description (e.g., "Invalid email or password")

          '401':
            description: Unauthorized             # Triggered when credentials are incorrect
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    error:
                      type: string                # Error message (e.g., "Invalid credentials")

          '500':
            description: Internal server error    # Catch-all for unexpected failures
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    error:
                      type: string                # Generic error message

  /auth/logout:
    post:
      summary: Log out a user                   # Short description for API docs and UIs
      tags: [Authentication]                    # Logical grouping for endpoints
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string                # Success message (e.g., "Logged out successfully.")

        '500':
          description: Internal server error    # Catch-all for logout failures
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string                # Generic error message (e.g., "Internal server error")
                    
  /auth/csrf-token:
    get:
      summary: Retrieve CSRF token
      tags: [Security]
      description: >
        Generates a CSRF token and sets it in a cookie.
        The token must be sent in the `x-csrf-token` header for all protected POST requests.
      responses:
        '200':
          description: CSRF token generated
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Cookie containing the CSRF token
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken:
                    type: string
                    description: CSRF token to be echoed back in `x-csrf-token` header

        '500':
          description: Failed to generate CSRF token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    
  /search:
    get:
      summary: Search for stock symbols              # Short description for API docs and UIs
      tags: [Stocks]                                 # Logical grouping for endpoints
      description: >
        Authenticated endpoint that searches for stock symbols via the Finnhub API.
        Requires a valid JWT token. Accepts a query parameter `q` for the stock symbol or name.

      security:
        - bearerAuth: []

      parameters:
        - name: q
          in: query
          required: true                             # Query parameter is required
          description: Stock symbol or name query
          schema:
            type: string

      responses:
        '200':
          description: Search results returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 1
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                          example: AAPL
                        name:
                          type: string
                          example: Apple Inc.
                        type:
                          type: string
                          example: Equity
                        region:
                          type: string
                          example: US
                        description:
                          type: string
                          example: Apple Inc. (Equity)

        '400':
          description: Missing search query
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Missing search query

        '401':
          description: Unauthorized (invalid or missing token)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized

        '500':
          description: Internal server error or API failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal server error                 # Error description (e.g., "Internal server error")

  /transactions/buy:
    post:
      summary: Buy stocks and add to user portfolio
      tags: [Transactions]

      # Request body must include symbol, quantity, and price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, quantity, price]
              properties:
                # Ticker symbol of the stock to buy (e.g. AAPL, MSFT)
                symbol:
                  type: string
                  description: Stock ticker symbol (e.g., AAPL)
                  example: AAPL
                # Number of shares to buy
                quantity:
                  type: integer
                  description: Number of shares to buy
                  example: 10
                # Price per share at the time of purchase
                price:
                  type: number
                  description: Price per share at time of purchase
                  example: 150.00

      # Require CSRF and bearer token authentication
      security:
        - csrfToken: []
        - bearerAuth: []

      # Possible responses from this endpoint
      responses:
        # If purchase is successful
        '200':
          description: Stock purchase successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

        # If required fields are missing or invalid
        '400':
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Missing or invalid parameters

        # If user is not authenticated
        '401':
          description: Unauthorized (invalid or missing token)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized

        # If CSRF token is invalid or missing
        '403':
          description: Invalid CSRF token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid CSRF token

        # If an unexpected error occurs on the server
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Something went wrong

  /transactions/sell:
    post:
      summary: Sell Stock
      description: Allows an authenticated user to sell a specified quantity of a stock at a given price.
      tags:
        - Transactions
      security:
        - bearerAuth: []  # JWT token authentication
        - csrfToken: []   # CSRF protection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - symbol
                - quantity
                - price
              properties:
                symbol:
                  type: string
                  example: "AAPL"
                quantity:
                  type: number
                  example: 5
                price:
                  type: number
                  example: 192.45
      responses:
        '200':
          description: Successful stock sale
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Stock sold successfully"
                  transactionId:
                    type: string
                    example: "txn_abc123"
        '400':
          description: Bad request due to missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing or invalid parameters"
        '401':
          description: Unauthorized access
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"
        '403':
          description: Invalid CSRF token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid CSRF token"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Something went wrong"
                   
  /account/balance:
    get:
      summary: Retrieve user's cash balance              # Short description for API docs and UIs
      tags: [Accounts]                                   # Logical grouping for endpoints
      description: >
        Authenticated endpoint that returns the user's current cash balance.
        Requires a valid session cookie containing a JWT token.

      # This endpoint requires authentication via session cookie
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Balance retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  cash_balance:
                    type: number                         # User's current cash balance
                    example: 10000.00

        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string                         # Error message (e.g., "Unauthorized")
                    example: Unauthorized

        '404':
          description: Account not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string                         # Error message (e.g., "Account not found")
                    example: Account not found

  /api/stocks/{symbol}:
    get:
      summary: Get stock quote and profile
      description: |
        Returns current quote and basic profile info for a given stock symbol.
        Requires authentication via bearer token in the request cookie.
      tags: [Stocks]
      parameters:
        - name: symbol
          in: path
          required: true
          description: Stock symbol (e.g., AAPL)
          schema:
            type: string
      responses:
        '200':
          description: Successfully fetched stock data
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                    example: AAPL
                  name:
                    type: string
                    example: Apple Inc
                  c:
                    type: number
                    description: Current price
                    example: 172.45
                  price:
                    type: number
                    description: Alias for current price (same as `c`)
                    example: 172.45
                  d:
                    type: number
                    description: Change
                    example: -1.23
                  dp:
                    type: number
                    description: Percent change
                    example: -0.71
                  h:
                    type: number
                    description: High price of the day
                    example: 174.2
                  l:
                    type: number
                    description: Low price of the day
                    example: 170.3
                  o:
                    type: number
                    description: Open price
                    example: 173.0
                  pc:
                    type: number
                    description: Previous close price
                    example: 173.68
                  country:
                    type: string
                    example: United States
                  currency:
                    type: string
                    example: USD
                  exchange:
                    type: string
                    example: NASDAQ
                  logo:
                    type: string
                    format: uri
                    example: https://logo.clearbit.com/apple.com
                  weburl:
                    type: string
                    format: uri
                    example: https://www.apple.com
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '500':
          description: Server or API key error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal server error

