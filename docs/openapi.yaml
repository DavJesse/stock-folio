# OpenAPI specification for the Stock Portfolio Tracker API
openapi: 3.0.3

# General API metadata used by tools like Swagger UI
info:
  title: Stock Portfolio Tracker API           # Human-readable name of the API
  version: 1.0.0                                # Semantic version of the API definition
  description: >                                # Brief explanation of the API's purpose
    REST API for a simulated stock portfolio tracker, including 
    user authentication and portfolio management.

# Define the base URL for the API endpoints
servers:
  - url: https://localhost:3000/api             # Local development server base path
    description: Development server             # Label for server usage context

# Endpoint definitions grouped under `paths`
paths:
  /auth/signup:
    post:
      summary: Register a new user account      # Short description for API docs and UIs
      tags: [Authentication]                    # Logical grouping for endpoints
      requestBody:
        required: true                          # Indicates this endpoint requires a body
        content:
          application/json:
            schema:
              type: object
              required: [email, password]       # Mandatory fields in the request payload
              properties:
                email:
                  type: string                  # User's email address
                password:
                  type: string                  # User's plaintext password (to be hashed server-side)

      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string                # Success message (e.g., "User created")

        '400':
          description: Invalid input            # Triggered by missing or malformed fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string                # Error description (e.g., validation error)

        '409':
          description: User already exists      # Triggered if email is already registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string                # Error message (e.g., "User already exists.")

        '500':
          description: Internal server error    # Catch-all for unhandled exceptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string                # Generic error message (e.g., "Internal server error")

  /auth/signin:
      post:
        summary: Authenticate a user              # Short description for API docs and UIs
        tags: [Authentication]                    # Logical grouping for endpoints
        requestBody:
          required: true                          # Indicates this endpoint requires a body
          content:
            application/json:
              schema:
                type: object
                required: [email, password]       # Mandatory login credentials
                properties:
                  email:
                    type: string                  # User's registered email address
                  password:
                    type: string                  # User's plaintext password (validated against hashed version)

        responses:
          '200':
            description: Login successful
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    message:
                      type: string                # Success message (e.g., "Login successful")
                    token:
                      type: string                # Authentication token (e.g., JWT or session token)

          '400':
            description: Invalid input            # Triggered by missing or malformed credentials
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    error:
                      type: string                # Error description (e.g., "Invalid email or password")

          '401':
            description: Unauthorized             # Triggered when credentials are incorrect
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    error:
                      type: string                # Error message (e.g., "Invalid credentials")

          '500':
            description: Internal server error    # Catch-all for unexpected failures
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    error:
                      type: string                # Generic error message

  /auth/logout:
    post:
      summary: Log out a user                   # Short description for API docs and UIs
      tags: [Authentication]                    # Logical grouping for endpoints
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string                # Success message (e.g., "Logged out successfully.")

        '500':
          description: Internal server error    # Catch-all for logout failures
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string                # Generic error message (e.g., "Internal server error")
                    
  /auth/csrf-token:
    get:
      summary: Retrieve CSRF token
      tags: [Security]
      description: >
        Generates a CSRF token and sets it in a cookie.
        The token must be sent in the `x-csrf-token` header for all protected POST requests.
      responses:
        '200':
          description: CSRF token generated
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Cookie containing the CSRF token
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken:
                    type: string
                    description: CSRF token to be echoed back in `x-csrf-token` header

        '500':
          description: Failed to generate CSRF token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    
  /search:
    get:
      summary: Search for stock symbols            # Short description for API docs and UIs
      tags: [Stocks]                               # Logical grouping for endpoints
      parameters:
        - name: q
          in: query
          required: true                           # Query parameter is required
          description: Stock symbol or name query  # Description for documentation
          schema:
            type: string                           # Expected type of query parameter

      responses:
        '200':
          description: Search results returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer                  # Total number of matching results (if applicable)
                    example: 1
                  result:
                    type: array                    # List of matching stocks
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string             # Stock ticker symbol
                          example: AAPL
                        name:
                          type: string             # Company name
                          example: Apple Inc.
                        type:
                          type: string             # Instrument type (e.g., "Equity")
                          example: Equity
                        region:
                          type: string             # Market region (e.g., "US")
                          example: US
                        description:
                          type: string             # Description or summary
                          example: Apple Inc. (Equity)

        '400':
          description: Missing search query        # Triggered when query is not provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string                   # Error message (e.g., "Missing search query")

        '500':
          description: Server error or API key issue # Catch-all for unexpected failures
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string                   # Error description (e.g., "Internal server error")
