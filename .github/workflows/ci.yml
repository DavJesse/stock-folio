name: CI

# Trigger workflow on push and pull request to key branches
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'chore/**'
      - 'auth/**'
      - 'docs/**'
      - 'ci/**' 
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Install, Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x] # Easily upgrade Node by adjusting this
    steps:
      # Step 1: Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js and cache node_modules
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Step 3: Install dependencies with clean CI-friendly method
      - name: Install dependencies
        run: npm ci

      # Step 4: Run linter to catch stylistic or formatting issues
      - name: Lint code
        run: npm run lint

      # Step 5: Run unit and snapshot tests via Jest
      - name: Run unit & snapshot tests
        run: npm test

      # Step 6: Install Playwright browsers and system dependencies
      - name: Install Playwright dependencies and browsers
        run: |
          npx playwright install-deps
          npx playwright install

      # Step 7: Run Playwright E2E tests
      - name: Run E2E tests
        run: npm run test:e2e

